<!doctype html>
<html lang="pt-br" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Gestão de Equipe & RH - GastroTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-950 text-gray-100 p-6">
    <div class="max-w-6xl mx-auto">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-white">Gestão de Equipe & RH</h1>
        <a href="/dashboard/" class="text-indigo-400 hover:underline text-sm"
          ><i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard</a
        >
      </div>

      <!-- Tabela Dinâmica alimentada pela API -->
      <div
        class="bg-slate-900 rounded-xl p-4 shadow-lg border border-slate-800"
      >
        <div class="flex justify-between items-center mb-4">
          <input
            type="text"
            id="filtroFuncionario"
            placeholder="Filtrar funcionários..."
            class="bg-slate-950 text-white px-4 py-2 rounded-lg border border-slate-800 text-sm focus:outline-none focus:border-indigo-500"
          />
        </div>
        <table class="w-full text-left text-gray-300">
          <thead>
            <tr class="border-b border-slate-800 text-indigo-400">
              <th class="p-3">Nome</th>
              <th class="p-3">Cargo</th>
              <th class="p-3">Salário Base</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="corpoTabela">
            <!-- Preenchido via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <script>
      async function carregarFuncionarios() {
        try {
          let resposta = await fetch("/api/rh/api/funcionarios/");
          let dados = await resposta.json();
          let corpo = document.getElementById("corpoTabela");
          corpo.innerHTML = "";

          dados.forEach((func) => {
            corpo.innerHTML += `
                    <tr class="border-b border-slate-800/50 hover:bg-slate-800/30 transition">
                        <td class="p-3 font-medium text-white">${func.nome}</td>
                        <td class="p-3">${func.cargo}</td>
                        <td class="p-3">R$ ${func.salario_base}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs ${func.ativo ? "bg-emerald-500/20 text-emerald-400" : "bg-rose-500/20 text-rose-400"}">${func.ativo ? "Ativo" : "Inativo"}</span></td>
                    </tr>
                `;
          });
        } catch (erro) {
          console.error("Erro ao carregar dados da API:", erro);
        }
      }
      carregarFuncionarios();
    </script>
  </body>
</html>
