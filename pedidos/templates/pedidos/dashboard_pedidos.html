<!doctype html>
<html lang="pt-br" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Vendas / Pedidos - OrigoERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-950 text-gray-100 p-6">
    <div class="max-w-6xl mx-auto">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-white">
          <i class="fa-solid fa-receipt text-blue-400 mr-2"></i> Vendas /
          Pedidos
        </h1>
        <a href="/dashboard/" class="text-indigo-400 hover:underline text-sm"
          ><i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard</a
        >
      </div>

      <div
        class="bg-slate-900 rounded-xl p-4 shadow-lg border border-slate-800"
      >
        <table class="w-full text-left text-gray-300">
          <thead>
            <tr class="border-b border-slate-800 text-blue-400">
              <th class="p-3">ID do Pedido</th>
              <th class="p-3">Status</th>
              <th class="p-3">Valor Total</th>
            </tr>
          </thead>
          <tbody id="corpoTabelaPedidos"></tbody>
        </table>
      </div>
    </div>

    <script>
      async function carregarPedidos() {
        try {
          let res = await fetch("/api/pedidos/");
          let dados = await res.json();
          let corpo = document.getElementById("corpoTabelaPedidos");
          corpo.innerHTML = "";
          dados.forEach((ped) => {
            corpo.innerHTML += `
                    <tr class="border-b border-slate-800/50 hover:bg-slate-800/30">
                        <td class="p-3 font-medium text-white">#${ped.id}</td>
                        <td class="p-3">${ped.status}</td>
                        <td class="p-3 text-emerald-400 font-semibold">R$ ${ped.valor_total}</td>
                    </tr>
                `;
          });
        } catch (e) {
          console.error(e);
        }
      }
      carregarPedidos();
    </script>
  </body>
</html>
