<!doctype html>
<html lang="pt-br" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>{{ titulo|default:"PDV" }} - OrigoERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-950 text-gray-100 min-h-screen p-4 flex flex-col">
    <div class="max-w-7xl mx-auto w-full flex-1 flex flex-col">
      <!-- Cabeçalho -->
      <header
        class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl mb-4 shadow-lg"
      >
        <div class="flex items-center space-x-3">
          <div
            class="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20 text-emerald-400"
          >
            <i class="fa-solid fa-cash-register text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-white">
              {{ titulo|default:"Frente de Caixa" }}
            </h1>
            <p class="text-xs text-gray-400">
              Caixa Operado por: {{ request.user.username }}
            </p>
          </div>
        </div>
        <a
          href="/api/financeiro/vendas-view/"
          class="bg-slate-800 hover:bg-slate-700 text-gray-300 px-4 py-2 rounded-lg text-sm transition border border-slate-700"
        >
          <i class="fa-solid fa-arrow-left mr-1"></i> Voltar
        </a>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 flex-1">
        <!-- Coluna Esquerda: Itens -->
        <div class="lg:col-span-2 flex flex-col space-y-4">
          <div
            class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg"
          >
            <label class="block text-sm font-medium text-gray-300 mb-2">
              <i class="fa-solid fa-barcode text-emerald-400 mr-1"></i>
              Selecione o Pedido (ID):
            </label>
            <form id="form-venda" method="POST" class="flex space-x-2">
              {% csrf_token %}
              <!-- Importante: Nome do campo igual ao que o Django espera no POST -->
              <select
                name="pedido_id"
                id="pedido_id"
                class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:border-emerald-500 outline-none"
              >
                <option value="">-- Selecione um Pedido --</option>
                {% for pedido in pedidos %}
                <option value="{{ pedido.id }}">
                  Pedido #{{ pedido.id }} - {{
                  pedido.cliente.nome|default:"Cliente não informado" }}
                </option>
                {% endfor %}
              </select>
              <button
                type="button"
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-lg font-medium transition"
              >
                Adicionar
              </button>
            </form>
          </div>

          <!-- Tabela de Itens -->
          <div
            class="bg-slate-900 border border-slate-800 rounded-xl shadow-lg flex-1 overflow-hidden flex flex-col"
          >
            <table class="w-full text-left">
              <thead
                class="bg-slate-800/40 text-xs text-gray-400 border-b border-slate-800"
              >
                <tr>
                  <th class="p-3">Produto</th>
                  <th class="p-3 text-center">Qtd</th>
                  <th class="p-3 text-right">Preço</th>
                  <th class="p-3 text-right">Total</th>
                </tr>
              </thead>
              <tbody
                id="tabela-carrinho"
                class="divide-y divide-slate-800 text-sm"
              >
                <!-- Itens serão carregados aqui -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Coluna Direita: Resumo -->
        <div
          class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-lg flex flex-col justify-between"
        >
          <div>
            <h2
              class="text-lg font-bold text-white border-b border-slate-800 pb-3 mb-4"
            >
              Fechamento
            </h2>

            <div class="space-y-4">
              <!-- Campos extras necessários pelo seu model -->
              <div>
                <label class="text-xs text-gray-400">Forma de Pagamento</label>
                <select
                  name="forma_pagamento"
                  form="form-venda"
                  class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm"
                >
                  <option value="dinheiro">Dinheiro</option>
                  <option value="cartao">Cartão</option>
                  <option value="pix">PIX</option>
                </select>
              </div>
            </div>

            <div
              class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2 mt-6"
            >
              <div
                class="flex justify-between text-base font-bold text-white pt-2 border-t border-slate-800"
              >
                <span>Total:</span>
                <span id="txt-total" class="text-emerald-400 text-xl"
                  >R$ 0,00</span
                >
              </div>
            </div>
          </div>

          <button
            type="submit"
            form="form-venda"
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-xl transition"
          >
            Finalizar Venda
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
