<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Fechar Caixa</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
        h1 { color: #333; font-size: 24px; margin-bottom: 20px; }
        p { color: #666; font-size: 16px; margin-bottom: 15px; }
        .btn { background-color: #d9534f; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        .btn:hover { background-color: #c9302c; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #337ab7; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fechar Caixa #{{ caixa.id }}</h1>
        <p><strong>Operador:</strong> {{ caixa.operador }}</p>
        <p><strong>Status Atual:</strong> {% if caixa.aberto %}Aberto{% else %}Fechado{% endif %}</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn">Confirmar Fechamento</button>
        </form>
        
        <a href="/api/financeiro/caixas-view/" class="back-link">Voltar para o Painel</a>
    </div>
</body>
</html>
