<!doctype html>
<html lang="pt-br" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>{{ titulo }} - OrigoERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-950 text-gray-100 p-6">
    <div class="max-w-xl mx-auto mt-10">
      <!-- Cabeçalho -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-white">
          <i class="fa-solid fa-cash-register text-emerald-400 mr-2"></i> {{
          titulo }}
        </h1>
        <a
          href="/api/financeiro/caixas-view/"
          class="text-indigo-400 hover:underline text-sm"
        >
          <i class="fa-solid fa-arrow-left"></i> Voltar aos Caixas
        </a>
      </div>

      <!-- Formulário -->
      <div
        class="bg-slate-900 rounded-xl border border-slate-800 shadow-lg p-6"
      >
        <form method="POST" class="space-y-4">
          {% csrf_token %} {{ form.as_p }}

          <div class="flex justify-end space-x-3 pt-4">
            <a
              href="/api/financeiro/caixas-view/"
              class="bg-slate-800 hover:bg-slate-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium transition"
            >
              Cancelar
            </a>
            <button
              type="submit"
              class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-lg shadow-emerald-900/20"
            >
              <i class="fa-solid fa-check mr-1"></i> Salvar
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
