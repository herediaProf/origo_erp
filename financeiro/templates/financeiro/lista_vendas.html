<!doctype html>
<html lang="pt-br" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Lista de Vendas - OrigoERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-950 text-gray-100 p-6">
    <div class="max-w-6xl mx-auto">
      <!-- Cabeçalho -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-white">
          <i class="fa-solid fa-cash-register text-emerald-400 mr-2"></i>
          Gerenciamento de Vendas
        </h1>
        <div class="space-x-3">
          <a
            href="/api/financeiro/vendas-view/novo/"
            class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition"
          >
            <i class="fa-solid fa-plus mr-1"></i> Nova Venda
          </a>
          <a
            href="/api/financeiro/dashboard/"
            class="text-indigo-400 hover:underline text-sm ml-4"
          >
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard
          </a>
        </div>
      </div>

      <!-- Tabela de Vendas -->
      <div
        class="bg-slate-900 rounded-xl border border-slate-800 shadow-lg overflow-hidden"
      >
        <table class="w-full text-left border-collapse">
          <thead>
            <tr
              class="bg-slate-800/50 text-gray-400 text-sm border-b border-slate-800"
            >
              <th class="p-4">ID</th>
              <th class="p-4">Valor Total</th>
              <th class="p-4">Taxa de Serviço</th>
              <th class="p-4 text-center">Ações</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800 text-sm">
            {% for venda in vendas %}
            <tr class="hover:bg-slate-800/30 transition">
              <td class="p-4 font-medium text-white">#{{ venda.id }}</td>
              <td class="p-4 text-emerald-400 font-semibold">
                R$ {{ venda.valor_total }}
              </td>
              <td class="p-4 text-amber-400">
                R$ {{ venda.valor_taxa_servico|default:"0.00" }}
              </td>
              <td class="p-4 text-center space-x-2">
                <a
                  href="{% url 'editar_venda_view' venda.id %}"
                  class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition border border-blue-600/30"
                >
                  <i class="fa-solid fa-pen mr-1"></i> Editar
                </a>
                <a
                  href="{% url 'deletar_venda_view' venda.id %}"
                  class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition border border-rose-600/30"
                  onclick="
                    return confirm('Deseja realmente excluir esta venda?');
                  "
                >
                  <i class="fa-solid fa-trash mr-1"></i> Excluir
                </a>
              </td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="4" class="p-8 text-center text-gray-500">
                Nenhuma venda cadastrada ou encontrada.
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
