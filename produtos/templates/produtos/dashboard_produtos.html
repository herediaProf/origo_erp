<!doctype html>
<html lang="pt-br" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Produtos & Estoque - OrigoERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-950 text-gray-100 p-6">
    <div class="max-w-6xl mx-auto">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-white">
          <i class="fa-solid fa-boxes-stacked text-emerald-400 mr-2"></i>
          Produtos & Estoque
        </h1>
        <a href="/dashboard/" class="text-indigo-400 hover:underline text-sm"
          ><i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard</a
        >
      </div>

      <div
        class="bg-slate-900 rounded-xl p-4 shadow-lg border border-slate-800"
      >
        <table class="w-full text-left text-gray-300">
          <thead>
            <tr class="border-b border-slate-800 text-emerald-400">
              <th class="p-3">Produto</th>
              <th class="p-3">Preço</th>
              <th class="p-3">Estoque Atual</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="corpoTabelaProdutos">
            <!-- Preenchido dinamicamente via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <script>
      async function carregarProdutos() {
        try {
          let res = await fetch("/api/produtos/");
          let dados = await res.json();
          let corpo = document.getElementById("corpoTabelaProdutos");
          corpo.innerHTML = "";

          dados.forEach((p) => {
            corpo.innerHTML += `
                    <tr class="border-b border-slate-800/50 hover:bg-slate-800/30 transition">
                        <td class="p-3 font-medium text-white">${p.nome}</td>
                        <td class="p-3">R$ ${p.preco}</td>
                        <td class="p-3">${p.estoque_atual} un</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs ${p.disponivel ? "bg-emerald-500/20 text-emerald-400" : "bg-rose-500/20 text-rose-400"}">${p.disponivel ? "Disponível" : "Indisponível"}</span></td>
                    </tr>
                `;
          });
        } catch (e) {
          console.error("Erro ao carregar produtos:", e);
        }
      }
      carregarProdutos();
    </script>
  </body>
</html>
