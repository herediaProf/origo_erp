<!doctype html>
<html lang="pt-br" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Clientes - OrigoERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-950 text-gray-100 p-6 min-h-screen">
    <div class="max-w-6xl mx-auto">
      <!-- Cabeçalho -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-white flex items-center">
          <i class="fa-solid fa-user-group text-orange-400 mr-2"></i> Gestão de
          Clientes
        </h1>
        <a
          href="/dashboard/"
          class="text-indigo-400 hover:underline text-sm flex items-center"
        >
          <i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao Dashboard
        </a>
      </div>

      <!-- Container Principal -->
      <div
        class="bg-slate-900 rounded-xl p-6 shadow-lg border border-slate-800"
      >
        <div class="flex justify-between items-center mb-6">
          <p class="text-gray-400">Base de dados e histórico de clientes.</p>
          <a
            href="novo/"
            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center transition"
          >
            <i class="fa-solid fa-plus mr-2"></i> Novo Cliente
          </a>
        </div>

        <!-- Tabela -->
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-800 text-gray-400 text-sm">
                <th class="py-3 px-4">Nome</th>
                <th class="py-3 px-4">CPF/CNPJ</th>
                <th class="py-3 px-4">Telefone</th>
                <th class="py-3 px-4 text-right">Ações</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800 text-sm">
              {% for c in clientes %}
              <tr class="hover:bg-slate-800/50 transition">
                <td class="py-3 px-4 font-medium text-white">{{ c.nome }}</td>
                <td class="py-3 px-4 text-gray-300">{{ c.cpf_cnpj }}</td>
                <td class="py-3 px-4 text-gray-300">{{ c.telefone }}</td>
                <td class="py-3 px-4 text-right space-x-2">
                  <a
                    href="editar/{{ c.id }}/"
                    class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-semibold transition"
                  >
                    Editar
                  </a>
                  <a
                    href="deletar/{{ c.id }}/"
                    class="inline-block bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-semibold transition"
                    onclick="
                      return confirm('Deseja realmente excluir este cliente?');
                    "
                  >
                    Deletar
                  </a>
                </td>
              </tr>
              {% empty %}
              <tr>
                <td colspan="4" class="py-8 text-center text-gray-500">
                  Nenhum cliente cadastrado.
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
