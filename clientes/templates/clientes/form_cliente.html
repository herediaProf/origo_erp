<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Cliente</title>
    <style>
      body {
        background-color: #0d1117;
        color: #c9d1d9;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 500px;
        margin: auto;
        background: #161b22;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #30363d;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0 15px 0;
        background: #0d1117;
        border: 1px solid #30363d;
        color: #fff;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .btn {
        padding: 10px 15px;
        border-radius: 4px;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-salvar {
        background-color: #238636;
        color: #fff;
      }
      .btn-voltar {
        background-color: #30363d;
        color: #c9d1d9;
        text-decoration: none;
        display: inline-block;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>{% if cliente %}Editar Cliente{% else %}Novo Cliente{% endif %}</h2>
      <form method="POST">
        {% csrf_token %}
        <label>Nome:</label>
        <input
          type="text"
          name="nome"
          value="{{ cliente.nome|default:'' }}"
          required
        />

        <label>CPF/CNPJ:</label>
        <input
          type="text"
          name="cpf_cnpj"
          value="{{ cliente.cpf_cnpj|default:'' }}"
          required
        />

        <label>Telefone:</label>
        <input
          type="text"
          name="telefone"
          value="{{ cliente.telefone|default:'' }}"
        />

        <label>E-mail:</label>
        <input
          type="email"
          name="email"
          value="{{ cliente.email|default:'' }}"
        />

        <button type="submit" class="btn btn-salvar">Salvar</button>
      </form>
      <a href="/clientes/" class="btn-voltar">Voltar</a>
    </div>
  </body>
</html>
