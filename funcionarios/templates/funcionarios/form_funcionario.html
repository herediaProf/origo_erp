<!doctype html>
<html lang="pt-br" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Funcionário</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-950 text-gray-100 p-6 min-h-screen flex items-center justify-center"
  >
    <div
      class="bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-xl max-w-md w-full"
    >
      <h2 class="text-xl font-bold text-white mb-6">
        {% if funcionario %}Editar{% else %}Novo{% endif %} Funcionário
      </h2>
      <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-300 mb-1"
            >Nome:</label
          >
          <input
            type="text"
            name="nome"
            value="{{ funcionario.nome|default:'' }}"
            required
            class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
          />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-300 mb-1"
            >Função / Cargo:</label
          >
          <input
            type="text"
            name="funcao"
            value="{{ funcionario.funcao|default:'' }}"
            required
            class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
          />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-300 mb-1"
            >CPF:</label
          >
          <input
            type="text"
            name="cpf"
            value="{{ funcionario.cpf|default:'' }}"
            required
            class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
          />
        </div>
        <div class="flex justify-between items-center">
          <a
            href="api/funcionarios/"
            class="text-gray-400 hover:text-white text-sm"
            >Voltar</a
          >
          <button
            type="submit"
            class="bg-green-600 hover:bg-green-700 text-white font-semibold px-4 py-2 rounded transition"
          >
            Salvar
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
